<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Beneke’s corner of the web</title>
  <style>
    * { box-sizing: border-box; }
    body {
      position: relative;
      isolation: isolate;
      max-width: 42rem;
      min-height: 100vh;
      margin: 0 auto;
      padding: 3rem 1rem;
      background: #000;
      color: #fff;
      font: 14px/1.45 Verdana, Geneva, sans-serif;
    }
    a, a:visited { color: #fff; }
    a:hover { color: #d7f68c; }
    h1, h2 { font-family: Georgia, "Times New Roman", serif; }
    h1 { font-size: 2rem; }
    h2 { font-size: 1.35rem; }
    header, footer { border-bottom: 1px solid #59606b; }
    header { padding-bottom: 1rem; }
    nav a { margin-right: 1rem; }
    main section { margin-top: 2rem; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #59606b; border-bottom: 0; }
    .space {
      position: fixed;
      z-index: -1;
      inset: 0;
      overflow: hidden;
      background: #000;
    }
    .space::before {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 8% 17%, #fff 99%, transparent),
        radial-gradient(1px 1px at 19% 72%, #c6ebff 99%, transparent),
        radial-gradient(1px 1px at 31% 29%, #fff 99%, transparent),
        radial-gradient(2px 2px at 44% 84%, #d7f68c 99%, transparent),
        radial-gradient(1px 1px at 58% 12%, #fff 99%, transparent),
        radial-gradient(1px 1px at 69% 63%, #c6ebff 99%, transparent),
        radial-gradient(2px 2px at 82% 24%, #fff 99%, transparent),
        radial-gradient(1px 1px at 93% 81%, #d7f68c 99%, transparent),
        radial-gradient(1px 1px at 4% 56%, #c6ebff 99%, transparent),
        radial-gradient(1px 1px at 15% 39%, #fff 99%, transparent),
        radial-gradient(1px 1px at 23% 91%, #fff 99%, transparent),
        radial-gradient(1px 1px at 28% 9%, #d7f68c 99%, transparent),
        radial-gradient(1px 1px at 38% 56%, #fff 99%, transparent),
        radial-gradient(1px 1px at 48% 42%, #c6ebff 99%, transparent),
        radial-gradient(1px 1px at 54% 94%, #fff 99%, transparent),
        radial-gradient(1px 1px at 63% 78%, #fff 99%, transparent),
        radial-gradient(1px 1px at 74% 46%, #d7f68c 99%, transparent),
        radial-gradient(1px 1px at 78% 8%, #fff 99%, transparent),
        radial-gradient(1px 1px at 88% 51%, #c6ebff 99%, transparent),
        radial-gradient(1px 1px at 97% 35%, #fff 99%, transparent);
      content: "";
    }
    .space picture {
      position: absolute;
      top: 50%;
      right: -2vw;
      width: min(76vh, 52vw, 768px);
      aspect-ratio: 1;
      transform: translateY(-50%);
    }
    .space img { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
    main, header, footer { text-shadow: 0 1px 4px #000; }
    @media (max-width: 600px) {
      body { padding-top: 2rem; }
      .space picture { right: -34vw; width: 110vw; opacity: .68; }
    }
  </style>
</head>
<body>
  <div class="space" aria-hidden="true">
    <picture>
      <source media="(prefers-reduced-motion: reduce)" srcset="assets/pixel-planet.png">
      <img src="assets/pixel-planet.gif" alt="">
    </picture>
  </div>
  <header>
    <h1>Beneke’s corner of the web</h1>
    <nav aria-label="Main navigation">
      <a href="#weblog">Weblog</a>
      <a href="#about">About</a>
    </nav>
  </header>
  <main>
    <section id="weblog">
      <h2>Weblog</h2>
      <p>This page is still being put together. Check back soon.</p>
    </section>
    <section id="about">
      <h2>About</h2>
      <p>A small personal site on the old-fashioned web.</p>
    </section>
  </main>
  <footer>
    <small>Hand-written HTML. No tracking, no fuss. Planet by <a href="https://github.com/Deep-Fold/PixelPlanets">PixelPlanets</a>.</small>
  </footer>
</body>
</html>
