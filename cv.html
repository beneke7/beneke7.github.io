<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Curriculum vitae — Benedek Bencz</title>
  <link rel="stylesheet" href="cv.css">
  <script src="cv.js" defer></script>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <nav class="controls" aria-label="CV controls">
    <a href="index.html">← About</a>
    <button type="button" id="pause" hidden>Pause</button>
    <button type="button" id="replay" hidden>Replay</button>
    <button type="button" id="read" hidden>Read CV</button>
    <label id="scroll-control" hidden>Scroll <input id="position" type="range" min="0" max="100" step="0.1" value="0" aria-label="Crawl position"></label>
    <details class="music" id="music">
      <summary>Music</summary>
      <div class="music-player">
        <iframe id="soundtrack" title="John Williams — Star Wars Main Title" width="320" height="220" allow="autoplay; encrypted-media; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <a href="https://www.youtube.com/watch?v=e9lapdvLSGw" target="_blank" rel="noopener">Listen on YouTube</a>
      </div>
    </details>
  </nav>
  <p class="status" role="status">Loading the CV…</p>
  <noscript><p class="status">JavaScript is needed to load the CV. <a href="cv/resume.json">Read the CV source</a>.</p></noscript>
  <main class="stage">
    <div class="plane">
      <article class="resume" aria-label="Curriculum vitae"></article>
    </div>
  </main>
</body>
</html>
